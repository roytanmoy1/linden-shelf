name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/server-smoke.mjs
      - run: npm audit --audit-level=high

  reviewer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURED_PRODUCT_IDS: '2,11,1,3,18'
      COMPOSE_PROJECT_NAME: linden-reviewer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - name: Build and start the documented stack
        shell: bash
        run: |
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          started="$(date +%s%3N)"
          echo "REVIEWER_STARTED_MS=$started" >> "$GITHUB_ENV"
          timeout 600s docker compose up --build --wait
          elapsed=$(( $(date +%s%3N) - started ))
          echo "Default Compose build to healthy services: ${elapsed}ms." >> "$GITHUB_STEP_SUMMARY"
          docker compose exec -T web nginx -t
          curl -fsSI http://127.0.0.1:3000/ | grep -Fi "frame-ancestors 'none'"
          docker compose exec -T api node -e "if (process.env.SMTP_HOST !== 'mailpit' || process.env.SMTP_PORT !== '1025') process.exit(1)"
      - name: Observe real supplier availability without substituting data
        id: supplier
        shell: bash
        run: |
          report="$RUNNER_TEMP/featured.json"
          status="$(curl -sS --max-time 12 -o "$report" -w '%{http_code}' http://127.0.0.1:3000/api/products/featured)"
          if [[ "$status" == 200 ]]; then
            jq -e --arg ids "$FEATURED_PRODUCT_IDS" '[.products[].id] == ($ids | split(",") | map(tonumber))' "$report"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            test "$status" = 502
            jq -e '.error.code == "UPSTREAM_ERROR"' "$report"
            upstream="$(docker compose exec -T api node --input-type=module -e "const r = await fetch('https://fakestoreapi.com/products', {headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(5000)}); console.log(r.status); await r.body?.cancel();")"
            test "$upstream" = 403
            note='Live Fake Store rejected this runner (HTTP 403); the unmodified API returned 502/UPSTREAM_ERROR. The live-supplier browser journey was not verified on this runner.'
            echo "::notice::$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run browser-to-inbox with the live supplier
        if: steps.supplier.outputs.available == 'true'
        shell: bash
        run: |
          npm run test:acceptance | tee "$RUNNER_TEMP/reviewer-journey.log"
          grep -E '^(Compose build|Passed:)' "$RUNNER_TEMP/reviewer-journey.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify graceful Linux shutdown
        run: |
          docker compose stop api
          docker compose logs --no-color api | grep -F '"event":"api_stopped"'
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq api)")" = 0
      - name: Run browser-to-inbox with controlled supplier input on the same images
        shell: bash
        env:
          REVIEWER_CONTROLLED_SUPPLIER: 'true'
        run: |
          docker compose down
          docker compose -f compose.yaml -f tests/compose.reviewer.yaml up --no-build --wait
          npm run test:acceptance | tee "$RUNNER_TEMP/reviewer-controlled.log"
          grep -E '^(Compose build|Passed:)' "$RUNNER_TEMP/reviewer-controlled.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose an unsuccessful stack check
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 10 api
      - name: Remove the isolated reviewer stack
        if: always()
        run: docker compose down