name: linden-shelf

services:
  web:
    build:
      context: .
      dockerfile: services/catalogue-web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: services/catalogue-api/Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      TRUST_INGRESS_PROXY: "true"
      ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}"
      PRODUCT_API_BASE_URL: "${PRODUCT_API_BASE_URL:-https://fakestoreapi.com}"
      PRODUCT_TIMEOUT_MS: "${PRODUCT_TIMEOUT_MS:-5000}"
      FEATURED_PRODUCT_IDS:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_CONNECTION_TIMEOUT_MS: "${SMTP_CONNECTION_TIMEOUT_MS:-5000}"
      SMTP_GREETING_TIMEOUT_MS: "${SMTP_GREETING_TIMEOUT_MS:-5000}"
      SMTP_SOCKET_TIMEOUT_MS: "${SMTP_SOCKET_TIMEOUT_MS:-10000}"
      MAIL_FROM: "${MAIL_FROM:-catalogue@lindenshelf.test}"
      SALES_EMAIL: "${SALES_EMAIL:-sales@lindenshelf.test}"
    depends_on:
      mailpit:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  mailpit:
    image: axllent/mailpit:v1.34.0
    user: "1000:1000"
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s